name: Scheduled

# Dependency updates and branch pruning. Replaces the GitLab weekly pipeline
# schedule, which was deactivated in terraform!243 when this repo became
# GitHub-canonical.
#
# The cron matches the schedule terraform derived for this repo, so the
# cadence is unchanged by the move.

on:
  schedule:
    - cron: '10 3 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    uses: tnoff/github-workflows/.github/workflows/renovate.yml@362a5f0d06fec04588c60863ccf0bf2ce709917f
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  branch-cleanup:
    name: Branch cleanup
    uses: tnoff/github-workflows/.github/workflows/branch-cleanup.yml@362a5f0d06fec04588c60863ccf0bf2ce709917f
    permissions:
      contents: write
      pull-requests: read
    with:
      age_days: 30
      dry_run: false
