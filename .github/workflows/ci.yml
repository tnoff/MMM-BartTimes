name: CI

# Pull-request checks. Ported from .gitlab-ci.yml as part of the
# GitHub-canonical migration; this repo is the pilot.
#
# The shared jobs come from tnoff/github-workflows as reusable workflows,
# pinned by SHA the same way the GitLab `include:` refs were. Renovate's
# github-actions manager keeps the pins current.

on:
  pull_request:

# One in-flight run per PR. Renovate force-pushes on rebase, and without this
# every rebase leaves its predecessor running to completion. GitLab could not
# express this: auto_cancel_pending_pipelines is fleet-disabled by design
# because it swept pending cross-project bump triggers on a shared ref, and it
# is per-project rather than per-workflow. Here the scope is this workflow only.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Scan for secrets
    uses: tnoff/github-workflows/.github/workflows/trufflehog.yml@badea054ae56c6ca72252cd22dab3a9f9b65268f

  test:
    name: Test
    runs-on: ubuntu-24.04
    # Fork PRs run automatically here, unlike on GitLab. There the jobs were
    # `when: manual` because the self-hosted runner executed untrusted code
    # inside the cluster; a GitHub-hosted runner is disposable and gets a
    # read-only token, so the reason does not carry over.
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          # Replaces the GitLab cache keyed on package-lock.json.
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  bump-version:
    name: Bump version
    # Matches the GitLab rule: only Renovate's patch branches, which carry the
    # dev- prefix from the additionalBranchPrefix in renovate.json.
    if: startsWith(github.head_ref, 'renovate/dev-')
    # A called workflow cannot hold more than the caller grants, and the bump
    # job pushes a commit. The workflow-level default above is contents: read.
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/bump-version.yml@badea054ae56c6ca72252cd22dab3a9f9b65268f
    with:
      version_file: package.json
      version_file_type: json
      version_json_key: version
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  result:
    name: CI result
    # The stable name for the branch ruleset to require.
    #
    # Requiring the individual jobs by name does not gate anything: GitHub
    # scores a `skipped` required check as SUCCESS, and every shared workflow
    # here carries an `allow_fork_prs` gate that can skip its only job.
    #
    # This job always runs and its name never changes, so the ruleset requires
    # exactly one context and the jobs underneath stay free to change.
    if: always()
    needs: [secrets, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Summarise
        run: |
          echo "secrets: ${{ needs.secrets.result }}"
          echo "test:    ${{ needs.test.result }}"

      - name: Fail if any job failed
        # `skipped` is deliberately allowed: with allow_fork_prs false a fork
        # PR skips the cascade, which is the intended outcome, not a failure.
        if: >-
          needs.secrets.result == 'failure' || needs.secrets.result == 'cancelled' ||
          needs.test.result == 'failure' || needs.test.result == 'cancelled'
        run: |
          echo "::error::One or more CI jobs did not pass."
          exit 1
