name: CI

# Pull-request checks. Ported from .gitlab-ci.yml as part of the
# GitHub-canonical migration; this repo is the pilot.
#
# The shared jobs come from tnoff/github-workflows as reusable workflows,
# pinned by SHA the same way the GitLab `include:` refs were. Renovate's
# github-actions manager keeps the pins current.

on:
  pull_request:

# One in-flight run per PR. Renovate force-pushes on rebase, and without this
# every rebase leaves its predecessor running to completion. GitLab could not
# express this: auto_cancel_pending_pipelines is fleet-disabled by design
# because it swept pending cross-project bump triggers on a shared ref, and it
# is per-project rather than per-workflow. Here the scope is this workflow only.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Scan for secrets
    uses: tnoff/github-workflows/.github/workflows/trufflehog.yml@5a8471d6059f25b68b4940ac1a1db98b43ba1a7d

  test:
    name: Test
    runs-on: ubuntu-24.04
    # Fork PRs run automatically here, unlike on GitLab. There the jobs were
    # `when: manual` because the self-hosted runner executed untrusted code
    # inside the cluster; a GitHub-hosted runner is disposable and gets a
    # read-only token, so the reason does not carry over.
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          # Replaces the GitLab cache keyed on package-lock.json.
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  # Supplies the code-owner approval Renovate's own PRs cannot get for
  # themselves: GitHub refuses to let a PR author approve their own PR, and
  # .github/CODEOWNERS + the ruleset's require_code_owner_review means one is
  # required before automerge can proceed.
  #
  # This must stay on the default `pull_request` trigger types. The ruleset
  # sets dismiss_stale_reviews_on_push and bump-version pushes to Renovate
  # branches after the PR opens, which dismisses the approval given here --
  # re-firing on `synchronize` is what makes the sequence converge.
  auto-approve:
    name: Auto-approve
    uses: tnoff/github-workflows/.github/workflows/renovate-auto-approve.yml@5a8471d6059f25b68b4940ac1a1db98b43ba1a7d
    permissions:
      contents: write
      pull-requests: write
    secrets:
      approval_token: ${{ secrets.APPROVAL_TOKEN }}

  bump-version:
    name: Bump version
    # Matches the GitLab rule: only Renovate's patch branches, which carry the
    # dev- prefix from the additionalBranchPrefix in renovate.json.
    if: startsWith(github.head_ref, 'renovate/dev-')
    # A called workflow cannot hold more than the caller grants, and the bump
    # job pushes a commit. The workflow-level default above is contents: read.
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/bump-version.yml@5a8471d6059f25b68b4940ac1a1db98b43ba1a7d
    with:
      version_file: package.json
      version_file_type: json
      version_json_key: version
    secrets:
      git_push_token: ${{ secrets.GIT_PUSH_TOKEN }}
