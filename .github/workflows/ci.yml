name: CI

# Pull-request checks. Ported from .gitlab-ci.yml as part of the
# GitHub-canonical migration; this repo is the pilot.
#
# The shared jobs come from tnoff/github-workflows as reusable workflows,
# pinned by SHA the same way the GitLab `include:` refs were. Renovate's
# github-actions manager keeps the pins current.

on:
  pull_request:

# One in-flight run per PR. Renovate force-pushes on rebase, and without this
# every rebase leaves its predecessor running to completion. GitLab could not
# express this: auto_cancel_pending_pipelines is fleet-disabled by design
# because it swept pending cross-project bump triggers on a shared ref, and it
# is per-project rather than per-workflow. Here the scope is this workflow only.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A PR that touches only catalog-info.yaml or renovate.json changes nothing any
  # job here inspects: no source, no image input, no packaging metadata, no
  # workflow. So all of them gate on this and CI reduces to the aggregate.
  #
  # This MUST stay a job-level `if:` and never become a workflow-level
  # `paths-ignore`. The branch ruleset requires the `CI result` context;
  # `paths-ignore` stops the whole workflow, so that context never reports at all
  # -- and a required check that never reports blocks the PR forever, where a
  # SKIPPED job scores as success. The two failure modes look nothing alike.
  #
  # Two files, named exactly, anchored. Not a prefix, not a glob, not a
  # deny-list of "things that feel unimportant": a list that grows by feel is one
  # somebody eventually adds a file to that did matter.
  #
  # An empty or unreadable diff yields false, which runs everything.
  metadata:
    name: Detect metadata-only change
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      only: ${{ steps.filter.outputs.only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "${BASE_REF}"
          FILES="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          ONLY=false
          if [ -n "${FILES}" ]; then
            OTHER="$(printf '%s\n' "${FILES}" | grep -vE '^(catalog-info\.yaml|renovate\.json)$' || true)"
            [ -z "${OTHER}" ] && ONLY=true
          fi
          echo "changed files:"
          printf '%s\n' "${FILES}" | sed -n 's/^/  /p'
          echo "metadata-only: ${ONLY}"
          echo "only=${ONLY}" >> "$GITHUB_OUTPUT"

  secrets:
    name: Scan for secrets
    needs: metadata
    if: needs.metadata.outputs.only != 'true'
    uses: tnoff/github-workflows/.github/workflows/trufflehog.yml@0d92c3c09cf7dd78ce36cb5f40618e7fc296e6a2

  test:
    name: Test
    needs: metadata
    if: needs.metadata.outputs.only != 'true'
    runs-on: ubuntu-26.04
    # Fork PRs run automatically here, unlike on GitLab. There the jobs were
    # `when: manual` because the self-hosted runner executed untrusted code
    # inside the cluster; a GitHub-hosted runner is disposable and gets a
    # read-only token, so the reason does not carry over.
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          # Replaces the GitLab cache keyed on package-lock.json.
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  bump-version:
    name: Bump version
    # Matches the GitLab rule: only Renovate's patch branches, which carry the
    # dev- prefix from the additionalBranchPrefix in renovate.json.
    if: startsWith(github.head_ref, 'renovate/dev-')
    # A called workflow cannot hold more than the caller grants, and the bump
    # job pushes a commit. The workflow-level default above is contents: read.
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/bump-version.yml@0d92c3c09cf7dd78ce36cb5f40618e7fc296e6a2
    with:
      version_file: package.json
      version_file_type: json
      version_json_key: version
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  # Catches a `uses:` whose inputs or secrets no longer match the pinned callee.
  # That mismatch fails the calling workflow at STARTUP -- no job is created, no
  # check reports, and no `workflow_run` event fires -- so neither this checks
  # list nor notify-failure.yml can see it. It is how one upstream secret rename
  # left `Release` dead in nine repos for five days in September 2026.
  contracts:
    name: Workflow contracts
    needs: metadata
    if: needs.metadata.outputs.only != 'true'
    uses: tnoff/github-workflows/.github/workflows/check-workflow-contracts.yml@0d92c3c09cf7dd78ce36cb5f40618e7fc296e6a2

  result:
    name: CI result
    # The stable name for the branch ruleset to require.
    #
    # Requiring the individual jobs by name does not gate anything: GitHub
    # scores a `skipped` required check as SUCCESS, and every shared workflow
    # here carries an `allow_fork_prs` gate that can skip its only job.
    #
    # This job always runs and its name never changes, so the ruleset requires
    # exactly one context and the jobs underneath stay free to change.
    if: always()
    needs: [secrets, test, contracts, metadata]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Summarise
        run: |
          echo "secrets:   ${{ needs.secrets.result }}"
          echo "metadata:  ${{ needs.metadata.result }}"
          echo "test:      ${{ needs.test.result }}"
          echo "contracts: ${{ needs.contracts.result }}"

      - name: Fail if any job failed
        # `skipped` is deliberately allowed: with allow_fork_prs false a fork
        # PR skips the cascade, which is the intended outcome, not a failure.
        if: >-
          needs.secrets.result == 'failure' || needs.secrets.result == 'cancelled' ||
          needs.test.result == 'failure' || needs.test.result == 'cancelled' ||
          needs.contracts.result == 'failure' || needs.contracts.result == 'cancelled' ||
          needs.metadata.result == 'failure' || needs.metadata.result == 'cancelled'
        run: |
          echo "::error::One or more CI jobs did not pass."
          exit 1
